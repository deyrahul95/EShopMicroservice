services:
  catalogdb:
    image: postgres:18.4
    container_name: catalogdb
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=CatalogDB
    restart: always
    volumes:
      - postgres_catalog:/var/lib/postgresql
    networks:
      - EShop-Microservice
  
  basketdb:
    image: postgres:18.4
    container_name: basketdb
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=BasketDB
    restart: always
    volumes:
      - postgres_basket:/var/lib/postgresql
    networks:
      - EShop-Microservice

  distributedcached:
    image: redis
    container_name: distributedcached
    restart: always
    networks:
      - EShop-Microservice

  catalog.api:
    image: catalog-api
    build:
      context: .
      dockerfile: ./Services/Catalog/Catalog.API/Dockerfile
    container_name: catalog-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8000
      - ConnectionStrings__Database=Server=catalogdb;Port=5432;Database=CatalogDB;User Id=postgres;Password=example
    depends_on:
      - catalogdb
    ports:
      - "6001:8000"
    networks:
      - EShop-Microservice

  basket.api:
    image: basket-api
    build:
      context: .
      dockerfile: ./Services/Basket/Basket.API/Dockerfile
    container_name: basket-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8000
      - ConnectionStrings__Database=Server=basketdb;Port=5432;Database=BasketDB;User Id=postgres;Password=example
      - ConnectionStrings__Redis=distributedcached:6379
    depends_on:
      - basketdb
      - distributedcached
    ports:
      - "6002:8000"
    networks:
      - EShop-Microservice

  discount.grpc:
    image: discount-grpc
    build:
      context: .
      dockerfile: ./Services/Discount/Discount.Grpc/Dockerfile
    container_name: discount-grpc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8000
      - ConnectionStrings__Database=Data Source=discount.db
    ports:
      - "6003:8000"
    networks:
      - EShop-Microservice

volumes:
  postgres_catalog:
  postgres_basket:

networks:
  EShop-Microservice:
    driver: bridge
