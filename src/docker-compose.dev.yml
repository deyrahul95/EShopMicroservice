services:
  basketdb:
    image: postgres:18.4
    container_name: basketdb
    shm_size: 128mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=example
      - POSTGRES_DB=BasketDB
    restart: always
    ports:
     - "5432:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql
    networks:
      - EShop-Microservice

  distributedcached:
    image: redis
    container_name: distributedcached
    restart: always
    ports:
     - "6379:6379"
    networks:
      - EShop-Microservice

